services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=pyeobugi'
      - 'MYSQL_USER=pyeobugi'
      - 'MYSQL_PASSWORD=pyeobugi-local'
      - 'MYSQL_ROOT_PASSWORD=root-local'
    labels:
      # Docker Compose Support가 만드는 JDBC URL에 붙는 파라미터 (plan 6-3 시간대 고정)
      org.springframework.boot.jdbc.parameters: 'connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true'
    ports:
      - '13306:3306'   # 로컬 DB 툴 접속용 고정 포트 (3306은 다른 MySQL과 겹칠 수 있어 피함)
